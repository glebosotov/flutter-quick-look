name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        flutter: ['3.44.0', '3.47.6']
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: make check
      - run: make pigeon
      - name: Check generated bridge is current
        run: git diff --exit-code -- lib/quick_look_messages.g.dart ios/quick_look/Sources/quick_look/messages.g.swift

  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter build ios --simulator --debug --no-codesign
      - name: Verify SwiftPM-only integration
        run: |
          test ! -e ios/Podfile
          test ! -e ios/Podfile.lock
          test ! -d ios/Pods
      - name: Run native regression tests
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO -clonedSourcePackagesDirPath "$PWD/build/ios/SourcePackages" BUILD_DIR="$PWD/build/ios" CODE_SIGNING_ALLOWED=NO
