name: quick_look
description: Preview local files with Apple's native Quick Look on iOS, including multiple files and swipe-to-dismiss control.
version: 0.3.0
homepage: https://github.com/glebosotov/flutter-quick-look
repository: https://github.com/glebosotov/flutter-quick-look

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Keep both sides of the platform channel reproducible.
  pigeon: 29.0.6

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: QuickLookPlugin
